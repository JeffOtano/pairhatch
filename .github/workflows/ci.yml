name: Mock protocol and packaging checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/clean_install_test.py

      - run: python -m pip install "setuptools>=77" wheel
      - run: python scripts/sdist_test.py
