[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pairhatch"
version = "10.0.0"
description = "Experimental, bounded local peer consultation broker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX"]
dependencies = []

[project.urls]
Source = "https://github.com/JeffOtano/pairhatch"
Documentation = "https://github.com/JeffOtano/pairhatch/blob/main/README.md"
Changelog = "https://github.com/JeffOtano/pairhatch/blob/main/CHANGELOG.md"

[project.scripts]
pairhatch = "pairhatch.__main__:main"
pairhatch-setup = "pairhatch.setup:main"
pairhatch-init = "pairhatch.init_config:main"

[tool.setuptools]
packages = ["pairhatch"]


[tool.setuptools.package-data]
pairhatch = ["resources/*.md"]
